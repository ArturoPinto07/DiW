<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
        }body{
            background-color: wheat;
            padding: 3%;
            margin: 0;
        }
        div{
            display: flex;
            justify-content: center;
            width: 100%;
        }
        form{
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            border-radius: 3%;
            border: solid;
            padding: 5%;
            border-color: white;
            background-color: rgb(173, 189, 83);
            font-size: 1.3rem;
        } 
        input[type="email"],
        input[type="password"],
        textarea{
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1.4rem;
            padding: 12px;
            margin: 8px 0 24px 0;
        }
        a,button{
            position: absolute;
            top:70.5%;
            right: 54.5%;
            width: 100px;
        }
    </style>
</head>
<body>
    <div>
    <form action="IniciarSesion.php" method="post">
        <h1>Login</h1>
        <p id="estado">Obteniendo ubicación...</p>

        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lon" id="lon">

        Ingrese el correo: <br>
        <input type="email" name="correo" required><br>
        Ingrese la contraseña: <br>
        <input type="password" name="contraseña" required><br>
        <input type="submit" id="btn" value="Iniciar sesión" disabled>
    </form>
    <a href = "Opciones.html"><button>Ir a opciones</button></a>
    </div>

    <script>
        const estado = document.getElementById("estado");

        navigator.geolocation.getCurrentPosition(
            function (pos) {
                document.getElementById("lat").value = pos.coords.latitude;
                document.getElementById("lon").value = pos.coords.longitude;
                document.getElementById("btn").disabled = false;
                estado.textContent = "Ubicación obtenida. Ya puedes iniciar sesión.";
            },
            function () {
                estado.textContent = "Debes permitir el acceso a tu ubicación para iniciar sesión.";
            },
            { enableHighAccuracy: true, timeout: 10000 }
    );
</script>
</body>
</html>
